name: Build image

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: "n8n version (e.g. 2.47.7)"
        required: true
        default: "2.47.7"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  N8N_VERSION: ${{ github.event.inputs.n8n_version || '2.47.7' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: N8N_VERSION=${{ env.N8N_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.N8N_VERSION }}
            ghcr.io/${{ github.repository }}:${{ env.N8N_VERSION }}-${{ github.run_number }}
      - name: Check ffmpeg and n8n on arm64
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh ghcr.io/${{ github.repository }}:${{ env.N8N_VERSION }} \
            -c 'ffmpeg -version | head -1; n8n --version; which ssh ssh-keygen curl flock'
